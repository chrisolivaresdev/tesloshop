<h1 class="font-bold text-3xl font-montserrat"> Todos los productos </h1>
<h2 class="text-xl"> Para todos los gustos </h2>

<div class="grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2">

  @for (product of productsResorce.value()?.products; track $index) {

    <app-card [product]=product />

  }
  @empty {

    <p>No hay productos</p>

  }

</div>
